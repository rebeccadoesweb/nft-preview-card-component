<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="description" content="Frontend Mentor - NFT preview card component">
  <meta name="keywords" content="Frontend Mentor, HTML, CSS, JavaSdcript">
  <meta name="author" content="Rebecca Padgett">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | NFT preview card component</title>
  <!-- !css -->
  <link rel="stylesheet" href="./assets/css/style.css">
  <!-- !js -->
  <script src="./assets/js/script.js" defer></script>
</head>

<body>
  <form class="color__control" action="#">
    <fieldset>
      <legend class="visually-hidden">Choose your NFT accent color</legend>
      <div class="color__options">
        <label class="color__option">
          <input type="radio" name="accent" value="cyan" data-js-input checked>
          <span class="color__dot color__dot--cyan" aria-hidden="true"></span>
          <p class="visually-hidden">Cyan</p>
        </label>
        <label class="color__option">
          <input type="radio" name="accent" value="pink" data-js-input>
          <span class="color__dot color__dot--pink" aria-hidden="true"></span>
          <p class="visually-hidden">Pink</p>
        </label>
        <label class="color__option">
          <input type="radio" name="accent" data-js-input value="blue">
          <span class="color__dot color__dot--blue" aria-hidden="true"></span>
          <p class="visually-hidden">Blue</p>
        </label>
        <label class="color__option">
          <input type="radio" name="accent" data-js-input value="purple">
          <span class="color__dot color__dot--purple" aria-hidden="true"></span>
          <p class="visually-hidden">Purple</p>
        </label>
        <label class="color__option">
          <input type="radio" name="accent" data-js-input value="green">
          <span class="color__dot  color__dot--green" aria-hidden="true"></span>
          <p class="visually-hidden">Green</p>
        </label>
        <label class="color__option">
          <input type="radio" name="accent" data-js-input value="orange">
          <span class="color__dot color__dot--orange" aria-hidden="true"></span>
          <p class="visually-hidden">Orange</p>
        </label>
      </div>
  </form>
  </fieldset>
  </div>
  <main class="card">
    <h1 class="visually-hidden">NFT preview card component</h1>
    <article>
      <figure class="card__banner">
        <img src="./assets/images/image-equilibrium.jpg" width="604" height="604" alt="3d render of a cube">
        <figcaption class="visually-hidden">3d render of a cube</figcaption>
      </figure>
      <div class="card__text-group">
        <h2 class="card__title">Equilibrium #3429</h2>
        <p>Our Equilibrium collection promotes balance and calm.</p>
        <ul class="card__list">
          <li class="card__list-item">
            <svg width="11" height="18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M11 10.216 5.5 18 0 10.216l5.5 3.263 5.5-3.262ZM5.5 0l5.496 9.169L5.5 12.43 0 9.17 5.5 0Z"
                fill="var(--accent)" />
            </svg>
            0.041 ETH
          </li>
          <li class="card__list-item">
            <img src="./assets/images/icon-clock.svg" aria-hidden="true" alt="">
            <time datetime="P3D">3 days left</time>
          </li>
        </ul>
      </div>
    </article>
    <section aria-labelledby="author">
      <h3 class="visually-hidden" id="author">NFT by Jules Wyvern</h3>
      <figure class="card__avatar">
        <img src="./assets/images/image-avatar.png" width="32" height="32" alt="headshot of Jules Wyvern">
        <figcaption>Creation of <a href="#" class="card__author">Jules Wyvern</a>
      </figure>
    </section>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://www.frontendmentor.io/profile/rebeccadoesweb">Rebecca Padgett</a>.
  </footer>
</body>

</html>
